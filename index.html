<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Si pudiera regalarte algo... 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-deep: #0b0e1a;
    --ink-mid: #171224;
    --gold: #d9a94e;
    --gold-soft: #e9c878;
    --petal: #f3c948;
    --petal-light: #ffe08a;
    --cream: #f6efe0;
    --cream-dim: #ece2cc;
    --leaf: #6f8c5a;
    --leaf-deep: #445c34;
    --star: rgba(255,244,214,0.9);
    --bg-1: var(--ink-deep);
    --bg-2: var(--ink-mid);
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-2) 0%, var(--bg-1) 65%);
    color: var(--cream);
    overflow-x: hidden;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: background 3s ease;
    -webkit-font-smoothing: antialiased;
  }

  body.stage-letter, body.stage-final {
    background: radial-gradient(ellipse at 50% 20%, #2a1f18 0%, #140f0c 70%);
  }

  .scene {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------- starfield ---------- */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 1;
    transition: opacity 2.5s ease;
  }
  body.stage-letter .stars, body.stage-final .stars { opacity: 0.15; }

  .star-dot {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--star);
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
  }

  /* ---------- floating petals ---------- */
  .petal-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }

  .petal {
    position: absolute;
    top: -5vh;
    width: 10px;
    height: 14px;
    background: linear-gradient(160deg, var(--petal-light), var(--petal) 70%);
    border-radius: 60% 40% 65% 35% / 60% 45% 55% 40%;
    opacity: 0;
    filter: drop-shadow(0 0 4px rgba(243,201,72,0.35));
    animation-name: petal-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes petal-fall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8% { opacity: 0.85; }
    92% { opacity: 0.7; }
    100% { transform: translate(var(--drift, 40px), 112vh) rotate(340deg); opacity: 0; }
  }

  /* ---------- intro stage ---------- */
  #stage-intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    flex-direction: column;
    gap: 28px;
    padding: 24px;
    text-align: center;
    transition: opacity 1.6s ease, filter 1.6s ease;
  }

  #stage-intro.hidden {
    opacity: 0;
    filter: blur(6px);
    pointer-events: none;
  }

  .flower-wrap {
    position: relative;
    width: min(46vw, 220px);
    height: min(46vw, 220px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .flower-glow {
    position: absolute;
    inset: -30%;
    background: radial-gradient(circle, rgba(243,201,72,0.35) 0%, rgba(243,201,72,0) 68%);
    border-radius: 50%;
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.92); opacity: 0.6; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  .flower-svg {
    position: relative;
    width: 78%;
    height: 78%;
    animation: sway 7s ease-in-out infinite;
    transform-origin: 50% 85%;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }

  .intro-eyebrow {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    color: var(--gold-soft);
    letter-spacing: 0.02em;
    opacity: 0.9;
  }

  .open-btn {
    margin-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.05rem, 3vw, 1.25rem);
    letter-spacing: 0.03em;
    color: var(--ink-deep);
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    border: none;
    padding: 14px 34px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(217,169,78,0.35);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  .open-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(217,169,78,0.5); }
  .open-btn:active { transform: translateY(0px) scale(0.98); }
  .open-btn:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; }

  /* ---------- letter stage ---------- */
  #stage-letter {
    position: relative;
    z-index: 10;
    display: none;
    padding: min(9vh, 70px) 20px 60px;
    flex-direction: column;
    align-items: center;
  }

  #stage-letter.visible { display: flex; }

  .letter-card {
    max-width: 620px;
    width: 100%;
    background: linear-gradient(175deg, var(--cream) 0%, var(--cream-dim) 100%);
    color: #241b12;
    border-radius: 6px;
    padding: clamp(30px, 6vw, 58px) clamp(24px, 6vw, 56px);
    box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 0 0 1px rgba(217,169,78,0.25);
    opacity: 0;
    transform: translateY(24px);
    animation: rise-in 1.4s ease forwards;
    position: relative;
  }

  @keyframes rise-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .letter-heading {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 600;
    color: #6b4a1e;
    text-align: center;
    margin: 0 0 28px;
    font-style: italic;
  }

  .letter-body {
    font-size: clamp(1.08rem, 2.6vw, 1.28rem);
    line-height: 1.75;
    white-space: pre-wrap;
    min-height: 1em;
  }

  .letter-body .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #6b4a1e;
    margin-left: 2px;
    vertical-align: -0.15em;
    animation: blink 0.9s steps(1) infinite;
  }
  .letter-body .cursor.done { display: none; }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .bouquet-wrap {
    margin-top: 36px;
    display: flex;
    justify-content: center;
    gap: 6px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.6s ease, transform 1.6s ease;
  }
  .bouquet-wrap.show { opacity: 1; transform: translateY(0); }

  .mini-flower { width: 46px; height: 46px; }
  .mini-flower:nth-child(2) { width: 58px; height: 58px; margin-top: -8px; }

  .continue-hint {
    margin-top: 34px;
    font-family: 'Caveat', cursive;
    font-size: 1.15rem;
    color: var(--gold-soft);
    opacity: 0;
    cursor: pointer;
    background: none;
    border: none;
    transition: opacity 1s ease;
  }
  .continue-hint.show { opacity: 0.85; }
  .continue-hint:hover { opacity: 1; }

  /* ---------- final stage ---------- */
  #stage-final {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #stage-final.visible { display: flex; }
  #stage-final.show { opacity: 1; }

  .final-garden {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse at 50% 100%, rgba(111,140,90,0.25), transparent 60%);
  }

  .final-flowers {
    position: absolute;
    bottom: -4%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-evenly;
    align-items: flex-end;
    z-index: -1;
    opacity: 0.9;
  }
  .final-flowers svg { width: clamp(30px, 6vw, 60px); }
  .final-flowers svg:nth-child(2n) { transform: translateY(10%) scale(0.85); }
  .final-flowers svg:nth-child(3n) { transform: translateY(-6%) scale(1.1); }

  .final-title {
    font-size: clamp(1.9rem, 6vw, 3rem);
    font-weight: 500;
    color: var(--cream);
    margin: 0 0 14px;
    max-width: 16ch;
  }

  .final-sub {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.15rem, 3.4vw, 1.5rem);
    color: var(--gold-soft);
    max-width: 30ch;
    margin: 0 0 40px;
  }

  .final-date {
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    color: rgba(246,239,224,0.55);
  }

  /* ---------- music toggle ---------- */
  .music-btn {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    right: 18px;
    z-index: 40;
    background: rgba(20,15,12,0.55);
    border: 1px solid rgba(217,169,78,0.4);
    color: var(--gold-soft);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.3s ease, color 0.3s ease;
  }
  .music-btn:hover { background: rgba(217,169,78,0.18); color: var(--cream); }
  /* etiqueta pequeña bajo el botón, se muestra la primera vez que suena */
  .music-btn:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .petal, .flower-svg, .flower-glow, .star-dot { animation: none !important; }
    .letter-card, .bouquet-wrap, .continue-hint, #stage-final { transition: opacity 0.4s ease !important; }
  }

  @media (max-width: 480px) {
    .letter-card { border-radius: 4px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="petal-field" id="petalField" aria-hidden="true"></div>

<!-- ================= INTRO ================= -->
<section id="stage-intro" class="scene">
  <div class="flower-wrap">
    <div class="flower-glow"></div>
    <svg class="flower-svg" id="mainFlower" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g stroke="var(--leaf-deep)" stroke-width="4" fill="none">
        <path d="M100 130 C 96 160, 92 178, 96 196" />
        <path d="M100 150 C 82 156, 70 150, 60 158" />
      </g>
      <g id="petalGroup" fill="var(--petal)">
        <!-- 12 petals generated by JS for smooth radial symmetry -->
      </g>
      <circle cx="100" cy="100" r="30" fill="#7a5324" />
      <circle cx="100" cy="100" r="30" fill="url(#seedGrad)" opacity="0.9"/>
      <defs>
        <radialGradient id="seedGrad" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#a8763a"/>
          <stop offset="100%" stop-color="#5c3d1c"/>
        </radialGradient>
      </defs>
    </svg>
  </div>
  <p class="intro-eyebrow">Tengo algo para ti...</p>
  <button class="open-btn" id="openGift">Abrir mi regalo 🌻</button>
</section>

<!-- ================= LETTER ================= -->
<section id="stage-letter" class="scene">
  <div class="letter-card">
    <h1 class="letter-heading" id="letterHeading">Para ti 🌻</h1>
    <div class="letter-body" id="letterBody"><span class="cursor"></span></div>
    <div class="bouquet-wrap" id="bouquetWrap">
      <svg class="mini-flower" viewBox="0 0 100 100"><use href="#flowerTemplate"/></svg>
      <svg class="mini-flower" viewBox="0 0 100 100"><use href="#flowerTemplate"/></svg>
      <svg class="mini-flower" viewBox="0 0 100 100"><use href="#flowerTemplate"/></svg>
    </div>
  </div>
  <button class="continue-hint" id="continueBtn">ver el final →</button>
</section>

<!-- ================= FINAL ================= -->
<section id="stage-final" class="scene">
  <div class="final-garden"></div>
  <div class="final-flowers" id="finalFlowers"></div>
  <h2 class="final-title">Estas flores son para ti. 💛</h2>
  <p class="final-sub">Porque algunas personas simplemente merecen recibir algo bonito.</p>
  <p class="final-date">Feliz 21 de septiembre 🌻</p>
</section>

<!-- reusable flower symbol -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flowerTemplate" viewBox="0 0 100 100">
    <g fill="var(--petal)">
      <ellipse cx="50" cy="18" rx="9" ry="16"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(45 50 50)"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(90 50 50)"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(135 50 50)"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(180 50 50)"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(225 50 50)"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(270 50 50)"/>
      <ellipse cx="50" cy="18" rx="9" ry="16" transform="rotate(315 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="14" fill="#7a5324"/>
  </symbol>
</svg>

<button class="music-btn" id="musicBtn" aria-pressed="false">♪ Música</button>

<script>
(function () {
  "use strict";

  // ---------- EDITA AQUÍ EL NOMBRE DE LA PERSONA ----------
  var NOMBRE = "ti";
  // ----------------------------------------------------------

  var heading = document.getElementById('letterHeading');
  heading.textContent = 'Para ' + NOMBRE + ' 🌻';

  // ---------- build main flower petals ----------
  var petalGroup = document.getElementById('petalGroup');
  var n = 12;
  for (var i = 0; i < n; i++) {
    var angle = (360 / n) * i;
    var el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    el.setAttribute('cx', 100);
    el.setAttribute('cy', 46);
    el.setAttribute('rx', 13);
    el.setAttribute('ry', 30);
    el.setAttribute('transform', 'rotate(' + angle + ' 100 100)');
    petalGroup.appendChild(el);
  }

  // ---------- starfield ----------
  var starsWrap = document.getElementById('stars');
  var starCount = window.innerWidth < 600 ? 40 : 80;
  for (var s = 0; s < starCount; s++) {
    var dot = document.createElement('div');
    dot.className = 'star-dot';
    dot.style.left = Math.random() * 100 + 'vw';
    dot.style.top = Math.random() * 100 + 'vh';
    dot.style.animationDelay = (Math.random() * 4) + 's';
    starsWrap.appendChild(dot);
  }

  // ---------- petal field ----------
  var petalField = document.getElementById('petalField');
  var petalTimers = [];
  function spawnPetal() {
    var p = document.createElement('div');
    p.className = 'petal';
    var left = Math.random() * 100;
    var dur = 9 + Math.random() * 7;
    var drift = (Math.random() * 80 - 40) + 'px';
    p.style.left = left + 'vw';
    p.style.setProperty('--drift', drift);
    p.style.animationDuration = dur + 's';
    p.style.transform = 'scale(' + (0.6 + Math.random() * 0.8) + ')';
    petalField.appendChild(p);
    setTimeout(function () { p.remove(); }, dur * 1000 + 500);
  }
  // gentle ambient rate, picks up slightly after opening
  var petalRate = 1400;
  var petalInterval = setInterval(function(){ if (Math.random() < 0.7) spawnPetal(); }, petalRate);

  // ---------- stage 1: open gift ----------
  var introStage = document.getElementById('stage-intro');
  var letterStage = document.getElementById('stage-letter');
  var finalStage = document.getElementById('stage-final');
  var openBtn = document.getElementById('openGift');
  var body = document.body;

  openBtn.addEventListener('click', function () {
    openBtn.disabled = true;
    // burst of petals
    for (var b = 0; b < 10; b++) {
      setTimeout(spawnPetal, b * 120);
    }
    clearInterval(petalInterval);
    petalInterval = setInterval(function(){ if (Math.random() < 0.85) spawnPetal(); }, 900);

    introStage.classList.add('hidden');
    body.classList.add('stage-letter');

    setTimeout(function () {
      introStage.style.display = 'none';
      letterStage.classList.add('visible');
      startTyping();
    }, 1500);
  });

  // ---------- stage 2: typing letter ----------
  var letterText =
    "Dicen que las flores amarillas representan alegría, cariño y nuevos comienzos.\n\n" +
    "Pero para mí, hoy tienen un significado diferente.\n\n" +
    "Hoy quería regalarte algo más que una flor. Quería regalarte un pequeño momento, una razón para sonreír y un recordatorio de lo especial que eres.\n\n" +
    "Tal vez una página web no pueda reemplazar un ramo de flores de verdad, pero sí puede guardar unas palabras que quería que tuvieras.\n\n" +
    "Por eso, este 21 de septiembre quería hacer algo diferente...\n\n" +
    "Quería que estas flores fueran para ti.";

  var letterBody = document.getElementById('letterBody');
  var bouquetWrap = document.getElementById('bouquetWrap');
  var continueBtn = document.getElementById('continueBtn');

  function startTyping() {
    var i = 0;
    letterBody.textContent = '';
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    letterBody.appendChild(cursor);

    var speed = 22;
    function tick() {
      if (i < letterText.length) {
        var ch = letterText.charAt(i);
        cursor.insertAdjacentText('beforebegin', ch);
        i++;
        var delay = speed;
        if (ch === '.' || ch === '\n') delay = speed * 8;
        setTimeout(tick, delay);
      } else {
        cursor.classList.add('done');
        setTimeout(function () {
          bouquetWrap.classList.add('show');
        }, 400);
        setTimeout(function () {
          continueBtn.classList.add('show');
        }, 1600);
      }
    }
    setTimeout(tick, 500);
  }

  // ---------- stage 3: final reveal ----------
  function revealFinal() {
    // build a small field of flowers at the bottom
    var wrap = document.getElementById('finalFlowers');
    var count = window.innerWidth < 600 ? 6 : 10;
    for (var k = 0; k < count; k++) {
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      var use = document.createElementNS(svgNS, 'use');
      use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#flowerTemplate');
      svg.appendChild(use);
      wrap.appendChild(svg);
    }

    for (var b2 = 0; b2 < 14; b2++) {
      setTimeout(spawnPetal, b2 * 90);
    }

    letterStage.classList.remove('visible');
    finalStage.classList.add('visible');
    body.classList.add('stage-final');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        finalStage.classList.add('show');
      });
    });
  }

  continueBtn.addEventListener('click', revealFinal);

  // ---------- música ambiental generada (sin archivos externos) ----------
  // Un pequeño pad de sintetizador: acordes suaves que se desvanecen unos
  // en otros, pensado para sonar cálido y discreto de fondo.
  var musicBtn = document.getElementById('musicBtn');
  var playing = false;
  var ctx = null;
  var masterGain = null;
  var chordTimer = null;

  // Progresión cálida y sencilla (en Hz), pensada para sonar como un
  // pad ambiental tipo "caja de música" lejana.
  var chords = [
    [261.63, 329.63, 392.00],        // Do mayor
    [220.00, 277.18, 329.63],        // La menor
    [246.94, 293.66, 369.99],        // Si dim / Fa mayor suave
    [196.00, 246.94, 293.66]         // Sol mayor
  ];
  var chordIndex = 0;

  // Escala pentatónica aguda para las "campanitas de hada" que brillan
  // sobre el pad — notas de Do mayor pentatónico en octavas altas.
  var fairyScale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
  var sparkleTimer = null;

  function ensureAudioContext() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0;
      var filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1200;

      // pequeño eco/reverbe mágico para las campanitas
      var delay = ctx.createDelay();
      delay.delayTime.value = 0.32;
      var feedback = ctx.createGain();
      feedback.gain.value = 0.32;
      var delayFilter = ctx.createBiquadFilter();
      delayFilter.type = 'lowpass';
      delayFilter.frequency.value = 3200;
      delay.connect(feedback);
      feedback.connect(delayFilter);
      delayFilter.connect(delay);

      masterGain.connect(filter);
      filter.connect(ctx.destination);
      masterGain.delayNode = delay;
      delay.connect(ctx.destination);
      masterGain.filterNode = filter;
    }
    return ctx;
  }

  function playSparkle() {
    var now = ctx.currentTime;
    var note = fairyScale[Math.floor(Math.random() * fairyScale.length)];
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = note;

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.6);

    var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) { pan.pan.value = (Math.random() * 1.6 - 0.8); }

    osc.connect(gain);
    if (pan) {
      gain.connect(pan);
      pan.connect(masterGain);
      pan.connect(masterGain.delayNode);
    } else {
      gain.connect(masterGain);
      gain.connect(masterGain.delayNode);
    }

    osc.start(now);
    osc.stop(now + 1.7);
  }

  function scheduleSparkles() {
    var delayMs = 550 + Math.random() * 1200;
    sparkleTimer = setTimeout(function () {
      playSparkle();
      scheduleSparkles();
    }, delayMs);
  }

  function playChord(freqs) {
    var now = ctx.currentTime;
    var chordGain = ctx.createGain();
    chordGain.gain.setValueAtTime(0, now);
    chordGain.gain.linearRampToValueAtTime(0.22, now + 2.2);
    chordGain.gain.linearRampToValueAtTime(0, now + 7.6);
    chordGain.connect(masterGain);

    freqs.forEach(function (freq, idx) {
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var lfo = ctx.createOscillator();
      var lfoGain = ctx.createGain();
      lfo.frequency.value = 0.15 + idx * 0.03;
      lfoGain.gain.value = 1.5;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start(now);
      lfo.stop(now + 8);

      osc.connect(chordGain);
      osc.start(now);
      osc.stop(now + 8);
    });
  }

  function startMusic() {
    ensureAudioContext();
    if (ctx.state === 'suspended') { ctx.resume(); }
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.2);

    playChord(chords[chordIndex % chords.length]);
    chordIndex++;
    chordTimer = setInterval(function () {
      playChord(chords[chordIndex % chords.length]);
      chordIndex++;
    }, 6000);

    scheduleSparkles();
  }

  function stopMusic() {
    if (chordTimer) { clearInterval(chordTimer); chordTimer = null; }
    if (sparkleTimer) { clearTimeout(sparkleTimer); sparkleTimer = null; }
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    }
  }

  musicBtn.addEventListener('click', function () {
    try {
      if (playing) {
        stopMusic();
        musicBtn.textContent = '♪ Música';
        musicBtn.setAttribute('aria-pressed', 'false');
      } else {
        startMusic();
        musicBtn.textContent = '❚❚ Pausar';
        musicBtn.setAttribute('aria-pressed', 'true');
      }
      playing = !playing;
    } catch (e) {
      // audio no disponible en este navegador — falla en silencio
    }
  });
})();
</script>
</body>
